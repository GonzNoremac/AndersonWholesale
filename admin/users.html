<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anderson Auto Group — Users</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="admin.css" />
  <script type="module" src="../js/users.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">
        <h1>Anderson Auto Group</h1>
        <p class="header-sub">Admin — User Management</p>
      </div>
      <div class="header-meta">
        <a href="../index.html" class="btn-secondary">View Buyer Site</a>
        <div class="user-menu" id="user-menu" style="display:none;">
          <button class="user-menu-trigger" onclick="toggleUserMenu()">
            <span id="header-user"></span>
            <span class="menu-caret">&#9662;</span>
          </button>
          <div class="user-menu-dropdown" id="user-menu-dropdown">
            <button class="menu-item menu-item--danger" onclick="adminSignOut()">Sign Out</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Admin Nav -->
  <nav class="admin-nav">
    <div class="admin-nav-inner">
      <a class="admin-nav-link" href="index.html">Auctions</a>
      <a class="admin-nav-link active" href="users.html">Users</a>
    </div>
  </nav>

  <main class="main-content" id="admin-content" style="display:none;">

    <section class="admin-section">
      <h2 class="section-title">
        Users
        <span class="section-count" id="users-count"></span>
      </h2>
      <div class="admin-card">

        <!-- Create User -->
        <p class="subsection-title">Create New User</p>
        <div class="create-user-grid">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input class="form-input" type="email" id="new-user-email"
              placeholder="buyer@example.com" />
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input class="form-input" type="password" id="new-user-password"
              placeholder="Min. 6 characters" />
          </div>
          <div class="form-group">
            <label class="form-label">Role</label>
            <select class="form-input" id="new-user-role">
              <option value="buyer">Buyer</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="form-group form-group--action">
            <button class="btn-primary" id="create-user-btn" onclick="createUser()">
              Create User
            </button>
          </div>
        </div>
        <div class="create-user-error" id="create-user-error" style="display:none;"></div>

        <div class="users-divider"></div>

        <!-- Users List -->
        <div id="users-list"></div>

      </div>
    </section>

  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

</body>
</html>
